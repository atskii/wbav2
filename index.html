                "@type": "Question",
                "name": "Jak działa system XP i roślinka (Streak Plant)?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Twoja wirtualna roślina to wskaźnik codziennej konsekwencji. Za każde wykonane zadanie zyskujesz punkty doświadczenia (XP), dzięki którym roślinka rośnie. Gdy wykonasz 100% zaplanowanego na dany dzień zestawu zadań, roślinka w pełni rozkwita."

                "@type": "Question",
                "name": "Czy moje dane i wpisy o nastroju są bezpieczne?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tak, w 100%. Twoje zadania i notatki o nastroju są bezpiecznie przechowywane i chronione. Żaden wpis nie jest udostępniany przełożonemu, działowi HR ani uczelni. Dodatkowo wpisy są automatycznie usuwane z serwera po 60 dniach braku aktywności."
                }
              },

                "@type": "Question",

                }
              },
              {
                "@type": "Question",
                "name": "Jak zintegrować aplikację z Kalendarzem Google?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Wejdź w Ustawienia (ikona koła zębatego), kliknij „Synchronizuj Kalendarz” w sekcji Integracja z Google i zaloguj się na swoje konto. Twoje spotkania i wykłady pojawią się jako zablokowane czasowo zadania z ikoną kłódki."
                }
              },
              {
                "@type": "Question",
                "name": "Co się stanie, jeśli usunę konto?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Usunięcie konta w Ustawieniach powoduje natychmiastowe i bezpowrotne skasowanie wszystkich Twoich zadań, statystyk i historii nastrojów z serwera."
                }
              },
              {
                "@type": "Question",
                "name": "Gdzie znajdę profesjonalną pomoc psychologiczną?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "W zakładce Pomoc (ikona koła ratunkowego) znajdziesz listę zweryfikowanych, bezpłatnych numerów wsparcia działających całą dobę (m.in. Kryzysowy Telefon Zaufania 116 123). Aplikacja sama delikatnie zasugeruje tę zakładkę, jeśli wykryje długotrwały spadek nastroju."
